# Mosquitto MQTT Broker Configuration for Docker

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection logs
connection_messages true

# Listener for internal Docker network (no auth)
listener 1883
allow_anonymous true

# Listener for Meshtastic devices (public, optional auth)
listener 8883
protocol mqtt
allow_anonymous true
# Uncomment for authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# WebSocket listener
listener 9001
protocol websockets
allow_anonymous true
# Uncomment for authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Message size limit (16MB for any potential large messages)
message_size_limit 16777216

# Connection settings
max_connections -1
max_keepalive 65535
