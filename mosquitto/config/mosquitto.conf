# Mosquitto MQTT Broker Configuration for Docker

# Not needed for meshtastic packets, which are real time in nature.
# Packets are stored in SQLite on the web app side as well.
persistence false

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection logs
connection_messages true

# Listener for internal Docker network (no auth)
listener 1883
allow_anonymous true

# Listener for Meshtastic devices (public, optional auth)
listener 8883
protocol mqtt
allow_anonymous true

# TODO: Uncomment for authentication:
# TODO(Q): Can I set a password using env vars?
# allow_anonymous false
# password_file /mosquitto/config/passwd

# WebSocket listener
listener 9001
protocol websockets
allow_anonymous true
# Uncomment for authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Message size limit (16MB for any potential large messages)
message_size_limit 16777216

# Connection settings
max_connections -1
max_keepalive 65535
