version: '3.8'

services:
  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: meshmonitor-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - meshmonitor-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Meshtastic MQTT Monitor Application (No Build Required)
  app:
    image: python:3.11-slim
    container_name: meshmonitor-app
    restart: unless-stopped
    ports:
      - "8080:5000"
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC=msh/#
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - DATABASE_PATH=/app/data/meshmonitor.db
    volumes:
      - ./:/app
      - ./data:/app/data
    working_dir: /app
    command: >
      bash -c "pip install --quiet -r requirements.txt && python main.py"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - meshmonitor-network

networks:
  meshmonitor-network:
    driver: bridge
